name: 中国移动会话保活

on:
  schedule:
    # app_token（App 会话）服务端寿命约 2 小时，定时 appTokenLogin 可重置计时。
    # 每 30 分钟保活一次（留足 GitHub cron 延迟/丢弃的容错余量），
    # 保证 CMCC_ACCOUNTS 里的 token 长期有效，无需反复抓包。
    # cron 为 UTC，:07/:37 分错开签到（22:10/14:10）与抢券时段。
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmcc-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # 含 1~10 分钟随机延迟 + 保活请求，留足余量
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 恢复凭证状态缓存
        uses: actions/cache/restore@v4
        with:
          path: .cmcc_cred_state.json
          key: cmcc-cred-state-${{ github.run_id }}
          restore-keys: cmcc-cred-state-

      - name: 安装依赖
        run: python3 -m pip install --user -r requirements.txt

      - name: 随机延迟（防风控指纹）
        run: sleep $((RANDOM % 540 + 60))

      - name: 执行会话保活
        env:
          CMCC_ACCOUNTS: ${{ secrets.CMCC_ACCOUNTS }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python3 cmcc_auto.py --keepalive

      - name: 保存凭证状态缓存
        if: always()
        run: |
          [ -f .cmcc_cred_state.json ] || echo '{"dead": false}' > .cmcc_cred_state.json
          echo "cred_state=$(cat .cmcc_cred_state.json)"
      - name: 写入凭证状态缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cmcc_cred_state.json
          key: cmcc-cred-state-${{ github.run_id }}
