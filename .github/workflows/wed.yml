name: 中国移动周三充值日抢券

on:
  schedule:
    # 场次按服务器时间（北京时间）08:00 / 12:00 左右，cron 按 UTC：
    # 23:55 UTC 周二 = 07:55 北京周三（等 08:00 场）
    # 03:55 UTC 周三 = 11:55 北京周三（等 12:00 场，若无此场次会自动跳过）
    # 脚本按 queryDrawPrizeInfo 的服务器时间校准等待，GitHub cron 的延迟误差可吸收。
    - cron: "55 23 * * 2"
    - cron: "55 3 * * 3"
  workflow_dispatch:
    inputs:
      at:
        description: "指定场次时间（服务器时间，如 08:00:00，留空自动选最近场次）"
        required: false
        default: ""
      dry_run:
        description: "只查场次/奖品不抢购"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cmcc-wed
  cancel-in-progress: false

jobs:
  seckill:
    runs-on: ubuntu-latest
    # 需覆盖「等待到场次 + 连发抢券」全程；场次若临近整点，10 分钟足够
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 恢复凭证状态缓存
        uses: actions/cache/restore@v4
        with:
          path: .cmcc_cred_state.json
          key: cmcc-cred-state-${{ github.run_id }}
          restore-keys: cmcc-cred-state-

      - name: 安装依赖
        run: python3 -m pip install --user -r requirements.txt

      - name: 执行周三充值日抢券并推送飞书
        env:
          CMCC_ACCOUNTS: ${{ secrets.CMCC_ACCOUNTS }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RESULT_FILE: ${{ runner.temp }}/cmcc_wed_result.txt
          AT: ${{ inputs.at }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          args=(cmcc_auto.py --wed --delay 20)
          [ -n "${AT:-}" ] && args+=(--at "$AT")
          [ "${DRY_RUN:-false}" = "true" ] && args+=(--dry-run)
          set +e
          python3 "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::抢券运行存在异常，详见上方日志与飞书卡片"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/cmcc_wed_result.txt
        run: |
          set -uo pipefail
          {
            echo "### 中国移动周三充值日抢券"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 保存凭证状态缓存
        if: always()
        run: |
          [ -f .cmcc_cred_state.json ] || echo '{"dead": false}' > .cmcc_cred_state.json
          echo "cred_state=$(cat .cmcc_cred_state.json)"
      - name: 写入凭证状态缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cmcc_cred_state.json
          key: cmcc-cred-state-${{ github.run_id }}
