name: 中国移动每日签到自动化

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 因此设两个时段互为备份 —— 脚本幂等，已签过只会返回「今日已签」，
    # 多触发不会重复领取。
    # cron 按 UTC 计时，括号内为北京时间（UTC+8）。
    - cron: "10 22 * * *"   # 22:10 UTC = 06:10 北京（主时段）
    - cron: "10 14 * * *"   # 14:10 UTC = 22:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmcc-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: python3 -m pip install --user -r requirements.txt

      - name: 执行中国移动签到并推送飞书
        id: run
        env:
          CMCC_ACCOUNTS: ${{ secrets.CMCC_ACCOUNTS }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RESULT_FILE: ${{ runner.temp }}/cmcc_result.txt
        run: |
          set -uo pipefail
          set +e
          python3 cmcc_auto.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮签到存在失败项，详见上方日志与飞书卡片"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/cmcc_result.txt
        run: |
          set -uo pipefail
          {
            echo "### 中国移动每日签到自动化"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi
